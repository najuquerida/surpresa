<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nós 💖</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #ffeef2;
      --card-bg: #ffffff;
      --accent-color: #ff85a2;
      --text-color: #5a4b51;
      --subtext-color: #8c7a82;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      font-family: 'Nunito', sans-serif;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(255, 133, 162, 0.2);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 3px solid #ffccd5;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    /* Tela de Senha */
    #lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .pass-input {
      padding: 12px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      text-align: center;
      font-size: 1.1rem;
      outline: none;
      width: 80%;
    }

    .pass-btn, .share-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .pass-btn:hover, .share-btn:hover {
      transform: scale(1.05);
    }

    /* Conteúdo Principal (Escondido no início) */
    #main-content {
      display: none;
    }

    .photo-frame {
      width: 100%;
      max-height: 280px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 4px solid var(--bg-color);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }

    .time-box {
      background-color: var(--bg-color);
      padding: 10px 5px;
      border-radius: 12px;
    }

    .time-box span {
      display: block;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent-color);
    }

    .time-box label {
      font-size: 0.75rem;
      color: var(--subtext-color);
      text-transform: uppercase;
      font-weight: 700;
    }

    .spotify-player {
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- TELA DE SENHA -->
    <div id="lock-screen">
      <h1>🔒 Espaço Privado</h1>
      <p style="color: var(--subtext-color);">Digite nossa senha secreta para entrar:</p>
      <input type="password" id="passwordInput" class="pass-input" placeholder="Digite a senha...">
      <button class="pass-btn" onclick="checkPassword()">Entrar 💖</button>
      <p id="error-msg" style="color: #ff4d4d; font-size: 0.85rem; display: none;">Senha incorreta! Tente de novo 💕</p>
    </div>

    <!-- CONTEÚDO SECRETO -->
    <div id="main-content">
      <h1>Desde aquele momento... ✨</h1>

      <div class="photo-frame">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Foto especial">
      </div>

      <div class="timer">
        <div class="time-box"><span id="days">0</span><label>Dias</label></div>
        <div class="time-box"><span id="hours">0</span><label>Horas</label></div>
        <div class="time-box"><span id="minutes">0</span><label>Min</label></div>
        <div class="time-box"><span id="seconds">0</span><label>Seg</label></div>
      </div>

      <div class="spotify-player">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4cOdK2wGLETKBW3PvgPWqT?utm_source=generator" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </div>

  </div>

  <script>
    // 1. ALTERE SUA SENHA AQUI:
    const SENHA_CORRETA = "31052026"; // Escolha a senha que quiser!

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === SENHA_CORRETA) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        startTimer();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    const startDate = new Date('2026-05-31T17:25:00');

    function startTimer() {
      function updateTimer() {
        const now = new Date();
        const diff = now - startDate;

        if (diff < 0) {
          document.getElementById('days').innerText = "0";
          document.getElementById('hours').innerText = "0";
          document.getElementById('minutes').innerText = "0";
          document.getElementById('seconds').innerText = "0";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('days').innerText = days;
        document.getElementById('hours').innerText = hours;
        document.getElementById('minutes').innerText = minutes;
        document.getElementById('seconds').innerText = seconds;
      }

      setInterval(updateTimer, 1000);
      updateTimer();
    }
  </script>
</body>
</html>
