<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nós ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffeef2;
      --card-bg: #ffffff;
      --accent-color: #ff85a2;
      --text-color: #5a4b51;
      --subtext-color: #8c7a82;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      font-family: 'Nunito', sans-serif;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 25px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(255, 133, 162, 0.2);
      text-align: center;
    }

    /* Tela de Login */
    .lock-screen h1 {
      font-family: 'Fredoka', sans-serif;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .lock-screen input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      margin: 15px 0;
      text-align: center;
      font-size: 1rem;
      outline: none;
    }

    .btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    /* Conteúdo Principal */
    .hidden { display: none; }

    .photo-frame {
      width: 100%;
      height: 320px;
      border-radius: 16px;
      overflow: hidden;
      margin: 15px 0;
      background: #fff0f3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .timer {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }

    .time-box {
      background: #fff0f3;
      padding: 10px;
      border-radius: 12px;
      flex: 1;
      margin: 0 4px;
    }

    .time-box span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .time-box label {
      font-size: 0.75rem;
      color: var(--subtext-color);
    }

    .spotify-player {
      margin-top: 15px;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Linha do Tempo */
    .timeline-title {
      font-family: 'Fredoka', sans-serif;
      color: var(--accent-color);
      margin: 25px 0 15px 0;
    }

    .timeline {
      position: relative;
      border-left: 3px solid #ffd1dc;
      padding-left: 20px;
      margin-left: 10px;
      text-align: left;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 20px;
    }

    .timeline-item::before {
      content: '💖';
      position: absolute;
      left: -31px;
      top: 0;
      background: white;
      border-radius: 50%;
      font-size: 0.9rem;
    }

    .timeline-date {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--accent-color);
    }

    .timeline-desc {
      font-size: 0.95rem;
      color: var(--text-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tela de Bloqueio -->
    <div id="lockScreen" class="lock-screen">
      <h1>Eu te amo!🤍</h1>
      <p>digite a senha para entrar:</p>
      <input type="password" id="passwordInput" placeholder="Digite a senha...">
      <button class="btn" onclick="verificarSenha()">Entrar ❤️</button>
      <p id="errorMessage" style="color: #ff4d4d; font-size: 0.85rem; display: none; margin-top: 10px;">Senha incorreta! Tente novamente.</p>
    </div>

    <!-- Conteúdo Principal -->
    <div id="mainContent" class="hidden">
      <h1 style="font-family: 'Fredoka', sans-serif; color: var(--accent-color);">Obrigada por ser você🤍</h1>
      
      <div class="photo-frame">
        <img src="us.jpeg" alt="Nossa Foto">
      </div>

      <div class="timer">
        <div class="time-box"><span id="days">0</span><label>Dias</label></div>
        <div class="time-box"><span id="hours">0</span><label>Horas</label></div>
        <div class="time-box"><span id="minutes">0</span><label>Min</label></div>
        <div class="time-box"><span id="seconds">0</span><label>Seg</label></div>
      </div>

      <div class="spotify-player">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/25S6S3A3C8M3C4bA4bB3k8?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>

      <!-- Seção da Linha do Tempo -->
      <h2 class="timeline-title">Nossa Linha do Tempo 📖</h2>
      <div class="timeline">
        <div class="timeline-item">
          <div class="timeline-date">31 de Maio de 2026</div>
          <div class="timeline-desc">Eu te vivo, meu amor</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function verificarSenha() {
      const senha = document.getElementById('passwordInput').value;
      if (senha === '31052026') {
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        iniciarContador();
      } else {
        document.getElementById('errorMessage').style.display = 'block';
      }
    }

    function iniciarContador() {
      const dataInicio = new Date('2026-05-31T00:00:00');

      function atualizar() {
        const agora = new Date();
        const diferenca = agora - dataInicio;

        if (diferenca > 0) {
          const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
          const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
          const minutos = Math.floor((diferenca / 1000 / 60) % 60);
          const segundos = Math.floor((diferenca / 1000) % 60);

          document.getElementById('days').innerText = dias;
          document.getElementById('hours').innerText = horas;
          document.getElementById('minutes').innerText = minutos;
          document.getElementById('seconds').innerText = segundos;
        }
      }

      atualizar();
      setInterval(atualizar, 1000);
    }
  </script>
</body>
</html>
